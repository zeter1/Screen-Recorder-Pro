name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify project structure and regressions
        run: python verify_project.py

      - name: Verify capture recovery
        run: python verify_capture_recovery.py

      - name: Verify save safety
        run: python verify_save_safety.py

      - name: Verify recording publication
        run: python verify_recording_publication.py
