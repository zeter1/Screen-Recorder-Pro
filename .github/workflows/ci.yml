name: Apply Screen Recorder Pro release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply release package
        shell: bash
        run: |
          set -euo pipefail
          test -f .release/chunk-001.txt
          tmp="$(mktemp -d)"
          cat .release/chunk-*.txt > "$tmp/release.b64"
          base64 --decode "$tmp/release.b64" > "$tmp/release.tar.gz"
          mkdir -p "$tmp/project"
          tar -xzf "$tmp/release.tar.gz" -C "$tmp/project"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.release/' \
            "$tmp/project/" ./
          rm -rf .release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: update Screen Recorder Pro"
          git push origin HEAD:main
